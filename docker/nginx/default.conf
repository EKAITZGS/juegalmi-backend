# Basado en data/nginx/web.conf del ejemplo de clase dockerSymfonySSL
server {
    listen 80;
    server_name _;
    server_tokens off;

    # Lo usará certbot en AWS para demostrar que el dominio es nuestro
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name _;
    server_tokens off;
    root /var/www/api/public;

    ssl_certificate /etc/letsencrypt/live/juegalmi/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/juegalmi/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass php:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        internal;
    }

    location ~ \.php$ {
        return 404;
    }
}
