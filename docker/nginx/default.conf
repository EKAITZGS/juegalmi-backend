# Basado en data/nginx/web.conf del ejemplo de clase dockerSymfonySSL.
# Esta máquina es privada: el HTTPS (certificado, redirección y dominio) lo gestiona el bastión,
# que le reenvía el tráfico por el puerto 80.
server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 3m;
    root /var/www/api/public;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass php:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        internal;
    }

    location ~ \.php$ {
        return 404;
    }
}
