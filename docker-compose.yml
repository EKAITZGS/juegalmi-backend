services:
  php:
    build: ./docker/php
    restart: always
    user: "1000:1000"
    environment:
      HOME: /tmp
    volumes:
      - ./api:/var/www/api
  nginx:
    image: nginx:stable-alpine
    restart: always
    depends_on:
      - php
    ports:
      - "80:80"
    volumes:
      - ./api/public:/var/www/api/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

# Misma red que db/docker-compose.yml: php llega a MariaDB como 'mysql'
networks:
  default:
    name: db_default
    external: true
