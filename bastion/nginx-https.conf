# Bastión, fase 2: HTTPS con el certificado de Let's Encrypt. Reenvía por la red privada:
#   /ws  -> Symfony (10.0.2.10), la API
#   /    -> Symfony (10.0.2.10), la web Angular
server {
    listen 80;
    server_name jokoa.duckdns.org;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name jokoa.duckdns.org;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/jokoa.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jokoa.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    location /ws {
        proxy_pass http://10.0.2.10;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://10.0.2.10;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
